disabled_rules:
- trailing_whitespace

opt_in_rules:
- empty_count
- empty_string
- force_try
- force_unwrapping
- force_cast

excluded:
- Pods
- SwiftLint/Common/3rdPartyLib

line_length:
    warning: 150
    error: 200
    ignores_function_declarations: true
    ignores_comments: true
    ignores_urls: true
    
function_body_length:
    warning: 50
    error: 100

function_parameter_count:
    warning: 6
    error: 8
    
type_body_length:
    warning: 200
    error: 400
    
file_length:
    warning: 1000
    error: 1500
    ignore_comment_only_lines: true
    
cyclomatic_complexity:
    warning: 10
    error: 15
  

reporter: "xcode"
